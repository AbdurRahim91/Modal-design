<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Confirmation Modal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0c0f17; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .btn-open { padding: 12px 24px; background: #dc2626; color: white; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .danger-box { background: #181d29; border: 1px solid #374151; border-radius: 16px; padding: 28px; max-width: 420px; width: 90%; text-align: center; }
    .warn-icon { width: 56px; height: 56px; background: rgba(220, 38, 38, 0.15); color: #ef4444; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 16px; }
    h3 { color: #f8fafc; font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.88rem; line-height: 1.5; margin-bottom: 24px; }
    .actions { display: flex; gap: 12px; }
    .btn-cancel { flex: 1; padding: 12px; background: #374151; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-delete { flex: 1; padding: 12px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-delete:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <button class="btn-open" onclick="toggle(true)">🗑️ Delete Project</button>
  <div class="modal-overlay" id="deleteModal">
    <div class="danger-box">
      <div class="warn-icon">⚠️</div>
      <h3>Delete Repository?</h3>
      <p>Are you sure you want to delete this repository? This action is permanent and cannot be undone.</p>
      <div class="actions">
        <button class="btn-cancel" onclick="toggle(false)">Cancel</button>
        <button class="btn-delete" onclick="alert('Project permanently deleted.'); toggle(false);">Yes, Delete</button>
      </div>
    </div>
  </div>
  <script>
    function toggle(v) { document.getElementById('deleteModal').classList.toggle('active', v); }
  </script>
</body>
</html>
