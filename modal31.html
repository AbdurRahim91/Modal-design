<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Center Modal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c1017; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .btn-open { padding: 12px 24px; background: #0284c7; color: white; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .help-box { background: #151e2f; border: 1px solid #283750; border-radius: 18px; padding: 30px; width: 90%; max-width: 440px; position: relative; }
    .close-btn { position: absolute; top: 16px; right: 18px; background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }
    h3 { color: #f8fafc; font-size: 1.25rem; margin-bottom: 6px; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
    .help-option { background: #0c121d; border: 1px solid #25334c; border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .help-option:hover { border-color: #0284c7; }
    .help-icon { font-size: 24px; }
    .help-text h5 { color: white; font-size: 0.92rem; }
    .help-text span { color: #94a3b8; font-size: 0.78rem; }
  </style>
</head>
<body>
  <button class="btn-open" onclick="toggle(true)">💬 Need Help?</button>
  <div class="modal-overlay" id="helpModal">
    <div class="help-box">
      <button class="close-btn" onclick="toggle(false)">&times;</button>
      <h3>Antigravity Help Center</h3>
      <p>How would you like to receive assistance today?</p>
      <div class="help-option" onclick="alert('Starting live chat...'); toggle(false);">
        <div class="help-icon">⚡</div>
        <div class="help-text">
          <h5>Instant Live Chat</h5>
          <span>Speak with our technical engineering team</span>
        </div>
      </div>
      <div class="help-option" onclick="alert('Opening knowledge base...'); toggle(false);">
        <div class="help-icon">📚</div>
        <div class="help-text">
          <h5>Knowledge Base &amp; Docs</h5>
          <span>Browse answers to frequently asked questions</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    function toggle(v) { document.getElementById('helpModal').classList.toggle('active', v); }
  </script>
</body>
</html>
