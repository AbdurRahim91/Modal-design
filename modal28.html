<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2FA Verification Modal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #090e17; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .btn-open { padding: 12px 24px; background: #14b8a6; color: white; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .twofa-card { background: #151e2f; border: 1px solid #283750; border-radius: 16px; padding: 32px; width: 90%; max-width: 420px; text-align: center; }
    h3 { color: #f8fafc; font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.85rem; line-height: 1.5; margin-bottom: 24px; }
    .otp-inputs { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .otp-inputs input { width: 44px; height: 50px; background: #0c121d; border: 1px solid #2c3c59; border-radius: 8px; text-align: center; color: white; font-size: 1.3rem; font-weight: 700; outline: none; }
    .otp-inputs input:focus { border-color: #14b8a6; }
    .btn-verify { width: 100%; padding: 12px; background: #14b8a6; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <button class="btn-open" onclick="toggle(true)">🔑 Verify 2FA</button>
  <div class="modal-overlay" id="twofaModal">
    <div class="twofa-card">
      <h3>Two-Factor Verification</h3>
      <p>Enter the 6-digit confirmation code generated by your Authenticator app.</p>
      <div class="otp-inputs">
        <input type="text" maxlength="1" value="4" />
        <input type="text" maxlength="1" value="8" />
        <input type="text" maxlength="1" value="2" />
        <input type="text" maxlength="1" value="9" />
        <input type="text" maxlength="1" value="1" />
        <input type="text" maxlength="1" value="7" />
      </div>
      <button class="btn-verify" onclick="alert('Code Verified Successfully!'); toggle(false);">Verify Code</button>
    </div>
  </div>
  <script>
    function toggle(v) { document.getElementById('twofaModal').classList.toggle('active', v); }
  </script>
</body>
</html>
